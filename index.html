            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            margin-bottom: 8px;

        }

        .header p {
            color: #6b7280;
            margin: 0;
        }

        .panel {
            background: #fff;
            padding: 24px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-weight: 700;
        }

        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d8dde6;
            border-radius: 10px;
            font-family: inherit;
            font-size: 15px;
            background: #fff;
        }

        textarea:focus {

            font-weight: 700;
        }

        button:disabled {

        }

        .primary-button {
            background: #2563eb;
            color: white;
        }

        .secondary-button {
            background: #e8edf5;

</head>

    </section>

    <section class="panel result-section>
