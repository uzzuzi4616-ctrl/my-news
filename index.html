    <main class="container">

                <option value="흥미롭고 친근하게">흥미롭고 친근하게</option>
            </select>

            <button id="summarizeBtn" class="primary">
                ✨ AI 뉴스 요약하기
            </button>

        </section>

                <span class="card-label">돈벌쥐 NEWS</span>
                <h3 id="cardTitle"></h3>
                <ul id="cardBullets"></ul>
                <p id="cardSummary" class="card-summary"></p>
            </div>

            <div class="actions">

                    💾 뉴스 카드 이미지 저장
                </button>
            </div>

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

    <script>
        const newsText = document.getElementById("newsText");
        const toneSelect = document.getElementById("tone");
        const summarizeBtn = document.getElementById("summarizeBtn");
        const statusBox = document.getElementById("status");

        const resultPanel = document.getElementById("resultPanel");
        const cardPanel = document.getElementById("cardPanel");

        function showStatus(message, isError = false) {
            statusBox.textContent = message;
            statusBox.classList.toggle("error", isError);
        }

        function renderList(element, items) {
            element.replaceChildren();

            items.forEach((item) => {
                const li = document.createElement("li");
                li.textContent = item;
                element.appendChild(li);
            });
        }

        summarizeBtn.addEventListener("click", async () => {
            const text = newsText.value.trim();

            if (text.length < 40) {
                showStatus("뉴스 원문을 40자 이상 입력해 주세요.", true);
                return;
            }

            summarizeBtn.disabled = true;
            showStatus("AI가 뉴스 내용을 분석하고 있습니다...");

            resultPanel.style.display = "none";
            cardPanel.style.display = "none";

            try {
                const response = await fetch("/api/summarize", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        text: text,
                        tone: toneSelect.value
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.error || "뉴스 요약 요청에 실패했습니다."
                    );
                }

                if (
                    typeof data.title !== "string" ||
                    !Array.isArray(data.bullets) ||
                    typeof data.summary !== "string"
                ) {
                    throw new Error("요약 결과의 형식이 올바르지 않습니다.");
                }

                document.getElementById("resultTitle").textContent =
                    data.title;

                renderList(
                    document.getElementById("resultBullets"),
                    data.bullets
                );

                document.getElementById("resultSummary").textContent =
                    data.summary;

                document.getElementById("cardTitle").textContent =
                    data.title;

                renderList(
                    document.getElementById("cardBullets"),
                    data.bullets
                );

                document.getElementById("cardSummary").textContent =
                    data.summary;

                resultPanel.style.display = "block";
                cardPanel.style.display = "block";

                showStatus("뉴스 요약이 완료되었습니다! 🎉");

            } catch (error) {
                console.error("뉴스 요약 오류:", error);
                showStatus(
                    "요약 실패: " + error.message +
                    "\nAPI 키와 서버 설정을 확인해 주세요.",
                    true
                );
            } finally {
                summarizeBtn.disabled = false;
            }
        });

        document.getElementById("downloadBtn")
            .addEventListener("click", async () => {
                const card = document.getElementById("newsCard");
                const downloadBtn = document.getElementById("downloadBtn");

                if (typeof html2canvas !== "function") {
                    showStatus(
                        "이미지 저장 라이브러리를 불러오지 못했습니다.",
                        true
                    );
