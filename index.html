    <!-- 자바스크립트 기능 제어 통합 스크립트 (이 구역만 싹 교체해 주세요) -->
    <script>
        const targetCard = document.getElementById('targetCard');
        const displayTitle = document.getElementById('displayTitle');
        const displayContent = document.getElementById('displayContent');
        const badgeContainer = document.getElementById('badgeContainer');
        const cardOverlay = document.getElementById('cardOverlay');

        // 1. 실시간 글자 타이핑 연동
        document.getElementById('keywordInput').addEventListener('input', (e) => {
            displayTitle.innerText = e.target.value;
        });
        document.getElementById('contentInput').addEventListener('input', (e) => {
            displayContent.innerText = e.target.value;
        });

        // 2. 로컬 배경 이미지 업로드 핵심 제어 모듈
        document.getElementById('imageUpload').addEventListener('change', function(e) {
            if (e.target.files && e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    // 배경 주소에 들어가는 문법 자바스크립트 템플릿 리터럴 형태로 정밀 수정 완료
                    targetCard.style.backgroundImage = `url('${event.target.result}')`;
                    
                    // 오버레이 불투명도 즉시 반영
                    cardOverlay.style.backgroundColor = `rgba(255, 255, 255, ${document.getElementById('opacitySlider').value})`;
                };
                reader.readAsDataURL(e.target.files[0]);
            }
        });

        // 3. 가독성 투명 가림막 수치 변경 이벤트
        document.getElementById('opacitySlider').addEventListener('input', function(e) {
            cardOverlay.style.backgroundColor = `rgba(255, 255, 255, ${e.target.value})`;
        });

        // 4. 드롭다운 대화창 웹 폰트 변경 연동
        document.getElementById('fontPicker').addEventListener('change', (e) => {
            targetCard.style.fontFamily = e.target.value;
        });

        // 5. 가로 정렬 버튼 시스템 이벤트 셋팅
        const alignButtons = document.querySelectorAll('#alignBtnGroup button');
        alignButtons.forEach(button => {
            button.addEventListener('click', function() {
                const alignValue = this.getAttribute('data-align');
                targetCard.style.textAlign = alignValue;

                if (alignValue === 'left') badgeContainer.style.justifyContent = 'flex-start';
                if (alignValue === 'center') badgeContainer.style.justifyContent = 'center';
                if (alignValue === 'right') badgeContainer.style.justifyContent = 'flex-end';

                alignButtons.forEach(btn => btn.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // 6. 테두리 깎기(모서리 모양) 버튼 시스템 이벤트 셋팅
        const radiusButtons = document.querySelectorAll('#radiusBtnGroup button');
        radiusButtons.forEach(button => {
            button.addEventListener('click', function() {
                const radiusValue = this.getAttribute('data-radius');
                targetCard.style.borderRadius = radiusValue;

                radiusButtons.forEach(btn => btn.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // 7. 최종 고화질 이미지 다운로드 처리 모듈
        document.getElementById('downloadBtn').addEventListener('click', function() {
            html2canvas(targetCard, {
                useCORS: true,       
                scale: 2,            
                logging: false
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'instagram-news-cover.png'; 
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(err => {
                console.error(err);
                alert('이미지 파일 다운로드 도중 에러가 발생했습니다.');
            });
        });
    </script>
</body>
</html>
