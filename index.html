<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뉴스 한 번에 | AI 뉴스 제작기</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif; background-color: #f5f6f7; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 650px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { font-size: 24px; text-align: center; color: #111; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        textarea { height: 100px; resize: none; }
        button { width: 100%; padding: 12px; background-color: #03cf5d; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #02b852; }
        
        /* 뉴스 결과창 디자인 (네이버 뉴스 스타일) */
        #newsResult { display: none; margin-top: 30px; border-top: 2px solid #111; padding-top: 20px; }
        .news-title { font-size: 26px; font-weight: bold; line-height: 1.4; color: #000; margin-bottom: 15px; }
        .news-info { font-size: 12px; color: #666; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #e5e5e5; }
        .news-img { width: 100%; max-height: 400px; object-fit: cover; border-radius: 4px; margin-bottom: 20px; display: none; }
        .news-content { font-size: 16px; line-height: 1.8; color: #333; text-align: justify; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="container">
    <h1>📰 뉴스 한 번에 만들기</h1>
    
    <div class="form-group">
        <label for="titleInput">뉴스 제목</label>
        <input type="text" id="titleInput" placeholder="예: [속보] 인스타 수익화, 이제 개인이 하루 만에 다 한다">
    </div>
    
    <div class="form-group">
        <label for="imgInput">이미지 링크 (URL)</label>
        <input type="text" id="imgInput" placeholder="인터넷 이미지 주소를 넣으세요 (비워두면 이미지 없음)">
    </div>
    
    <div class="form-group">
        <label for="contentInput">뉴스 본문 내용</label>
        <textarea id="contentInput" placeholder="여기에 들어갈 뉴스 기사 본문을 자유롭게 적어보세요."></textarea>
    </div>
    
    <button onclick="generateNews()">뉴스 기사 생성하기</button>

    <!-- 결과 화면 -->
    <div id="newsResult">
        <div class="news-title" id="resTitle"></div>
        <div class="news-info">기사입력 : <span id="resDate"></span> | 언론사 속보팀</div>
        <img class="news-img" id="resImg" src="" alt="뉴스 이미지">
        <div class="news-content" id="resContent"></div>
    </div>
</div>

<script>
    function generateNews() {
        const title = document.getElementById('titleInput').value;
        const img = document.getElementById('imgInput').value;
        const content = document.getElementById('contentInput').value;
        
        if(!title || !content) {
            alert('제목과 본문을 입력해주세요!');
            return;
        }
        
        document.getElementById('resTitle').innerText = title;
        document.getElementById('resContent').innerText = content;
        
        // 날짜 자동으로 넣기
        const now = new Date();
        document.getElementById('resDate').innerText = now.toLocaleString();
        
        // 이미지 처리
        const imgTag = document.getElementById('resImg');
        if(img) {
            imgTag.src = img;
            imgTag.style.display = 'block';
        } else {
            imgTag.style.display = 'none';
        }
        
        // 결과창 보여주기
        document.getElementById('newsResult').style.display = 'block';
        
        // 생성 후 화면 아래로 부드럽게 스크롤
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
</script>

</body>
</html>
