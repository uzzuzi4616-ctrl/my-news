<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 뉴스 한 번에 | 제미나이 자동 생성기</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif; background-color: #f5f6f7; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 650px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { font-size: 24px; text-align: center; color: #111; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 12px; background-color: #03cf5d; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #02b852; }
        .loading { display: none; text-align: center; font-weight: bold; color: #666; margin: 20px 0; }
        
        /* 뉴스 결과창 디자인 (네이버 뉴스 스타일) */
        #newsResult { display: none; margin-top: 30px; border-top: 2px solid #111; padding-top: 20px; }
        .news-title { font-size: 26px; font-weight: bold; line-height: 1.4; color: #000; margin-bottom: 15px; }
        .news-info { font-size: 12px; color: #666; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #e5e5e5; }
        .news-content { font-size: 16px; line-height: 1.8; color: #333; text-align: justify; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="container">
    <h1>🤖 AI 뉴스 자동 생성기 (Gemini 무과금)</h1>
    
    <div class="form-group">
        <label for="keywordInput">원하는 뉴스 주제 (단어나 키워드)</label>
        <input type="text" id="keywordInput" placeholder="예: 인스타 카드뉴스 수익화 비밀, 주4일제 전격 시행">
    </div>
    
    <button onclick="generateAINews()">AI 뉴스로 자동 만들기</button>
    <div class="loading" id="loadingText">⏳ 구글 AI 기자가 기사를 창작하는 중입니다... (약 3초)</div>

    <!-- 결과 화면 -->
    <div id="newsResult">
        <div class="news-title" id="resTitle"></div>
        <div class="news-info">기사입력 : <span id="resDate"></span> | 구글 AI 속보 전문 기자</div>
        <div class="news-content" id="resContent"></div>
    </div>
</div>

<script>
    // 100% 무료 등급 구글 제미나이 API Key 연동
    const GEMINI_API_KEY = '여기에_방금_복사한_구글_제미나이_API_열쇠를_넣으세요';

    async function generateAINews() {
        const keyword = document.getElementById('keywordInput').value;
        const loadingText = document.getElementById('loadingText');
        const newsResult = document.getElementById('newsResult');
        
        if(!keyword) {
            alert('원하는 뉴스 주제를 입력해주세요!');
            return;
        }
        
        loadingText.style.display = 'block';
        newsResult.style.display = 'none';
        
        try {
            const response = await fetch(`https://googleapis.com{AQ.Ab8RN6LlJGIrHIFvON7tAgahyZAgNmtlEnJzGOnPvukgmpEt9g}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    contents: [{
                        parts: [{
                            text: `너는 대한민국 최고의 언론사 기자야. 사용자가 주는 키워드를 바탕으로, 신뢰감 있고 그럴싸한 네이버 뉴스 스타일의 속보 기사를 창작해줘. 출력 형식은 반드시 [제목]과 [본문]을 정확히 나누어 작성해주고, 첫 줄은 "제목: [자극적인 속보 제목]"으로 시작하고 다음 줄부터는 "본문: [기사 내용]" 형식으로 정확히 시작하게 해줘. 주제 키워드: ${keyword}`
                        }]
                    }]
                })
            });

            const data = await response.json();
            const aiResponse = data.candidates[0].content.parts[0].text;
            
            // AI가 준 답변에서 제목과 본문 분리하기
            const titleMatch = aiResponse.match(/제목:\s*(.*)/);
            const contentMatch = aiResponse.match(/본문:\s*([\s\(\S\)]*)/);
            
            const finalTitle = titleMatch ? titleMatch[1] : `[속보] '${keyword}' 관련 긴급 뉴스 보도`;
            const finalContent = contentMatch ? contentMatch[1] : aiResponse;

            document.getElementById('resTitle').innerText = finalTitle;
            document.getElementById('resContent').innerText = finalContent;
            
            const now = new Date();
            document.getElementById('resDate').innerText = now.toLocaleString();
            
            loadingText.style.display = 'none';
            newsResult.style.display = 'block';
            
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

        } catch (error) {
            console.error(error);
            alert('AI 연동 중 오류가 발생했습니다. 구글 API 키가 정상적인지 확인해 주세요!');
            loadingText.style.display = 'none';
        }
    }
</script>

</body>
</html>
