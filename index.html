<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인스타용 인공지능 뉴스 표지 생성기</title>
    <!-- 폰트 변경을 위한 구글 웹폰트 미리 로드 -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        /* 기본 배경 배경 설정 */
        body {
            font-family: 'Nanum Gothic', sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 40px; /* 도구창과 카드뉴스 사이의 간격 */
        }

        /* [왼쪽] 디자인 편집 툴 스타일 */
        .editor-sidebar {
            width: 320px;
            background: #ffffff;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
            border: 1px solid #e9ecef;
            box-sizing: border-box;
        }
        .editor-sidebar h3 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 18px;
            color: #212529;
        }
        .editor-sidebar p {
            font-size: 13px;
            color: #868e96;
            margin-bottom: 24px;
        }
        .control-item {
            margin-bottom: 20px;
        }
        .control-item label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #495057;
            margin-bottom: 8px;
        }
        .control-item select,
        .control-item input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }
        .control-item select:focus,
        .control-item input[type="text"]:focus {
            border-color: #00c73c;
        }
        .option-buttons {
            display: flex;
            gap: 6px;
        }
        .option-buttons button {
            flex: 1;
            padding: 10px;
            background: #f1f3f5;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            color: #495057;
            cursor: pointer;
            transition: all 0.2s;
        }
        .option-buttons button:hover {
            background: #e9ecef;
        }
        .option-buttons button.active {
            background: #00c73c;
            color: #ffffff;
            border-color: #00c73c;
            font-weight: bold;
        }

        /* [오른쪽] 카드뉴스 작업 영역 */
        .workspace {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .workspace-title {
            align-self: flex-start;
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 12px;
        }
        .workspace-subtitle {
            align-self: flex-start;
            font-size: 13px;
            color: #666;
            margin-top: -8px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 실제 인스타 카드 (정사각형 메인 박스) */
        .insta-card {
            width: 540px;
            height: 540px;
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 45px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            /* 초기 세팅: 정렬 왼쪽, 테두리 직각 */
            text-align: left;
            border-radius: 0px; 
        }

        /* 카드 내부 정렬을 위한 래퍼 */
        .card-align-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        /* 초록색 네이버 뉴스 배지 상자 */
        .badge-container {
            display: flex;
            justify-content: flex-start; /* 좌, 우, 가운데 정렬 연동용 */
            margin-bottom: 16px;
        }
        .naver-badge {
            background-color: #00c73c;
            color: white;
            font-size: 13px;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 2px;
        }

        /* 구분선 스타일 */
        .divider-line {
            height: 4px;
            background-color: #000000;
            margin-bottom: 28px;
            width: 100%;
        }

        /* 텍스트 요소들 */
        .news-title {
            font-size: 38px;
            font-weight: 700;
            color: #000000;
            margin: 0 0 12px 0;
            line-height: 1.3;
            word-break: keep-all;
        }
        .news-date {
            font-size: 14px;
            color: #757575;
            margin-bottom: 28px;
        }
        .news-content {
            font-size: 20px;
            color: #333333;
            line-height: 1.6;
            margin: 0;
            white-space: pre-wrap;
        }

        /* 하단 워터마크 안내 문구 */
        .card-footer {
            position: absolute;
            bottom: 35px;
            left: 45px;
            right: 45px;
            font-size: 12px;
            color: #b0b0b0;
            text-align: center;
        }

        /* 인스타 이미지 파일 다운로드 버튼 */
        .download-action-btn {
            width: 540px;
            background-color: #111111;
            color: #ffffff;
            border: none;
            padding: 16px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            margin-top: 20px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }
        .download-action-btn:hover {
            background-color: #222222;
        }
    </style>
</head>
<body>

    <!-- [왼쪽] 비서가 만든 도구 상자 영역 -->
    <div class="editor-sidebar">
        <h3>디자인 편집 툴</h3>
        <p>글자 스타일과 테두리 모양을 실시간으로 편집해 보세요.</p>
        
        <!-- 키워드 연동 입력창 (기존 기능을 여기에 합쳤습니다) -->
        <div class="control-item">
            <label for="keywordInput">기사 제목 (테스트 키워드)</label>
            <input type="text" id="keywordInput" value="테스트">
        </div>

        <div class="control-item">
            <label for="contentInput">기사 본문 내용</label>
            <input type="text" id="contentInput" value="테스트...">
        </div>

        <!-- 1. 글씨 폰트 변경 메뉴 -->
        <div class="control-item">
            <label for="fontPicker">글씨 폰트 변경</label>
            <select id="fontPicker">
                <option value="'Nanum Gothic', sans-serif">기본 깔끔한 고딕체</option>
                <option value="'Gowun Batang', serif">단정한 고전 명조체</option>
                <option value="'Black Han Sans', sans-serif">속보용 두꺼운 헤드라인체</option>
                <option value="'Song Myung', serif">날카로운 뉴스 신문체</option>
            </select>
        </div>

        <!-- 2. 왼쪽/가운데/오른쪽 정렬 메뉴 -->
        <div class="control-item">
            <label>글씨 및 콘텐츠 정렬</label>
            <div class="option-buttons" id="alignBtnGroup">
                <button onclick="updateAlignment('left', this)" class="active">왼쪽</button>
                <button onclick="updateAlignment('center', this)">가운데</button>
                <button onclick="updateAlignment('right', this)">오른쪽</button>
            </div>
        </div>

        <!-- 3. 이미지 사각/둥글게 모서리 조절 메뉴 -->
        <div class="control-item">
            <label>이미지 외곽 모양 조절</label>
            <div class="option-buttons" id="radiusBtnGroup">
                <button onclick="updateCornerRadius('0px', this)" class="active">직각 사각형</button>
                <button onclick="updateCornerRadius('24px', this)">둥근 사각형</button>
                <button onclick="updateCornerRadius('48px', this)">많이 둥글게</button>
            </div>
        </div>
    </div>


    <!-- [오른쪽] 기존 사장님의 원래 뉴스 카드뉴스 화면 디자인 -->
    <div class="workspace">
        <div class="workspace-title">테스트</div>
        <div class="workspace-subtitle">
            <span style="font-size:12px;">📁</span> 자동 생성된 인스타 정사각형 뉴스 표지
        </div>

        <!-- 원래 디자인 뼈대 그대로 복원 완료 -->
        <div class="insta-card" id="targetCard">
            <div class="card-align-wrapper">
                <div class="badge-container" id="badgeContainer">
                    <span class="naver-badge">네이버 뉴스</span>
                </div>
                <div class="divider-line"></div>
                
                <h1 class="news-title" id="displayTitle">테스트</h1>
                <div class="news-date">기사입력 : 2026. 10. 14. | 속보전문팀</div>
                <p class="news-content" id="displayContent">테스트...</p>
                
                <div class="card-footer">
                    Powered by AI News Generator (무료 부수입 도구)
                </div>
            </div>
        </div>
        
        <!-- 하단 다운로드 검은색 버튼 모양 유지 -->
        <button class="download-action-btn">
            💾 인스타용 이미지 파일 다운로드
        </button>
    </div>

    <!-- 기능 제어 스크립트 코드 -->
    <script>
        const targetCard = document.getElementById('targetCard');
        const displayTitle = document.getElementById('displayTitle');
        const displayContent = document.getElementById('displayContent');
        const badgeContainer = document.getElementById('badgeContainer');

        // 입력 폼 제어 기능 연결
        const titleInput = document.getElementById('keywordInput');
        const contentInput = document.getElementById('contentInput');

        titleInput.addEventListener('input', (e) => {
            displayTitle.innerText = e.target.value;
        });
        contentItem = contentInput.addEventListener('input', (e) => {
            displayContent.innerText = e.target.value;
