<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API 키워드 전송 테스트</title>
</head>
<body>

    <!-- 1. 키워드를 입력받는 HTML 요소 -->
    <div>
        <label for="keywordInput">키워드 입력:</label>
        <input type="text" id="keywordInput" placeholder="검색어나 키 키워드를 입력하세요">
        <button id="sendBtn">서버로 전송</button>
    </div>

    <!-- 2. 자바스크립트 코드 -->
    <script>
        document.getElementById('sendBtn').addEventListener('click', function() {
            // 입력창에서 값을 가져옵니다.
            const keyword = document.getElementById('keywordInput').value;

            // 빈 값 체크
            if (!keyword.trim()) {
                alert('키워드를 입력해 주세요!');
                return;
            }

            // [방법 A] GET 방식 전송 예시 (URL 파라미터에 포함)
            const getUrl = `https://example.com{encodeURIComponent(keyword)}`;
            
            fetch(getUrl)
                .then(response => response.json())
                .then(data => console.log('GET 성공:', data))
                .catch(error => console.error('GET 에러:', error));


            /* [방법 B] POST 방식 전송 예시 (본문에 포함)
               필요할 때 아래 주석을 풀고 사용하세요.
            
            const postUrl = 'https://example.com';
            fetch(postUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ keyword: keyword })
            })
            .then(response => response.json())
            .then(data => console.log('POST 성공:', data))
            .catch(error => console.error('POST 에러:', error));
            */
            
            alert(`'${keyword}' 전송 요청을 보냈습니다. (F12를 눌러 콘솔창을 확인하세요)`);
        });
    </script>

</body>
</html>
