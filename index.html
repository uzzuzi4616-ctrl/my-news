<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인스타 트렌디 뉴스 카드 생성기</title>
    
    <!-- 1. 구글 프리미엄 웹폰트 가독성 라인업 로드 -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <!-- 2. 고화질 스크린샷 캡처 다운로드 라이브러리 정식 풀 주소 -->
    <script src="https://cloudflare.com"></script>
    
    <style>
        /* 프리미엄 트렌디 UI 레이아웃 스펙 */
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f1f3f5;
            margin: 0;
            padding: 50px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 50px;
        }

        /* [왼쪽] 인체공학적 디자인 편집 사이드바 */
        .editor-sidebar {
            width: 350px;
            background: #ffffff;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid #e9ecef;
            box-sizing: border-box;
        }
        .editor-sidebar h3 {
            margin: 0 0 6px 0;
            font-size: 20px;
            font-weight: 900;
            color: #1a1d20;
        }
        .editor-sidebar p {
            font-size: 13px;
            color: #868e96;
            margin: 0 0 30px 0;
        }
        .control-item {
            margin-bottom: 24px;
        }
        .control-item label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #495057;
            margin-bottom: 10px;
        }
        .control-item select,
        .control-item input[type="text"],
        .control-item input[type="file"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            font-size: 14px;
            color: #212529;
            outline: none;
            box-sizing: border-box;
            background-color: #f8f9fa;
            transition: all 0.2s;
        }
        .control-item input[type="file"] {
            padding: 10px 14px;
            cursor: pointer;
            background-color: #fff;
        }
        .control-item select:focus,
        .control-item input[type="text"]:focus {
            border-color: #00c73c;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(0, 199, 60, 0.1);
        }
        .control-item input[type="range"] {
            width: 100%;
            margin-top: 8px;
            accent-color: #00c73c;
            cursor: pointer;
        }
        .option-buttons {
            display: flex;
            gap: 8px;
        }
        .option-buttons button {
            flex: 1;
            padding: 12px;
            background: #f1f3f5;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            color: #495057;
            cursor: pointer;
            transition: all 0.2s;
        }
        .option-buttons button:hover {
            background: #e9ecef;
        }
        .option-buttons button.active {
            background: #00c73c;
            color: #ffffff;
            border-color: #00c73c;
        }

        /* [오른쪽] 작업 영역 및 최종 프리뷰 */
        .workspace {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .workspace-title {
            align-self: flex-start;
            font-size: 18px;
            font-weight: 800;
            color: #212529;
            margin-bottom: 6px;
        }
        .workspace-subtitle {
            align-self: flex-start;
            font-size: 13px;
            color: #6c757d;
            margin-bottom: 20px;
        }

        /* 인스타그램 피드 1:1 표준 규격 카드 (오류 전면 차단 빌드) */
        .insta-card {
            width: 540px;
            height: 540px;
            background-color: #ffffff;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            padding: 50px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.06);
            text-align: left;
            border-radius: 0px; 
            transition: border-radius 0.2s;
        }

        /* ★ 가독성 확보용 최신 글래스모피즘 오버레이 쉴드 ★ */
        .card-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 1); /* 초기상태 흰색도화지 */
            z-index: 1;
            transition: background-color 0.1s ease;
            pointer-events: none;
        }

        /* 내부 콘텐츠 최상위 레이어 설계 */
        .card-content-area {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }
        .badge-container {
            display: flex;
            justify-content: flex-start; 
            margin-bottom: 20px;
        }
        .naver-badge {
            background-color: #00c73c;
            color: white;
            font-size: 13px;
            font-weight: 800;
            padding: 6px 14px;
            border-radius: 4px;
            letter-spacing: -0.3px;
        }
        .divider-line {
            height: 4px;
            background-color: #111111;
            margin-bottom: 30px;
            width: 100%;
        }
        .news-title {
            font-size: 40px;
            font-weight: 900;
            color: #000000;
            margin: 0 0 14px 0;
            line-height: 1.35;
            word-break: keep-all;
            letter-spacing: -0.5px;
        }
        .news-date {
            font-size: 13px;
            color: #6c757d;
            margin-bottom: 30px;
            font-weight: 500;
        }
        .news-content {
            font-size: 21px;
            color: #2b2d31;
            line-height: 1.7;
            margin: 0;
            font-weight: 500;
            white-space: pre-wrap;
            word-break: keep-all;
            letter-spacing: -0.2px;
        }

        /* 하단 브랜딩 워터마크 안내 문구 */
        .card-footer {
            position: absolute;
            bottom: 35px;
            left: 50px;
            right: 50px;
            font-size: 12px;
            font-weight: 600;
            color: #adb5bd;
            text-align: center;
            z-index: 2;
            letter-spacing: 0.5px;
        }

        /* 초고화질 스크린샷 렌더링 다운로드 버튼 */
        .download-action-btn {
            width: 540px;
            background-color: #111111;
            color: #ffffff;
            border: none;
            padding: 18px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 12px;
            margin-top: 24px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.2s;
            text-align: center;
        }
        .download-action-btn:hover {
            background-color: #2b2d31;
            transform: translateY(-2px);
        }
        .download-action-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <!-- [좌측 컨트롤 타워 엔지니어링 패널] -->
    <div class="editor-sidebar">
        <h3>디자인 편집 툴</h3>
        <p>인스타그램 피드용 스펙을 실시간 제어하세요.</p>
        
        <!-- 1. 리소스 업로드 섹션 -->
        <div class="control-item">
            <label for="imageUpload">배경 이미지 업로드</label>
            <input type="file" id="imageUpload" accept="image/*">
        </div>
        
        <div class="control-item">
            <label for="opacitySlider">배경 이미지 진하기 (오른쪽으로 갈수록 진해짐)</label>
            <!-- ★ 수식을 완벽히 정반대로 대칭 설계하여 오른쪽으로 밀수록 사진이 선명하게 표현됨 ★ -->
            <input type="range" id="opacitySlider" min="0" max="1" step="0.05" value="0">
        </div>

        <!-- 2. 타이포그래피 입력 제어 시스템 -->
        <div class="control-item">
            <label for="keywordInput">기사 제목</label>
            <input type="text" id="keywordInput" value="테스트">
        </div>

        <div class="control-item">
            <label for="contentInput">기사 본문 내용</label>
            <input type="text" id="contentInput" value="테스트...">
        </div>

        <!-- 3. 고해상도 프리미엄 서체 변경 셀렉터 -->
        <div class="control-item">
            <label for="fontPicker">글씨 폰트 스타일 변경</label>
            <select id="fontPicker">
                <option value="'Pretendard', sans-serif">트렌디한 프리텐다드 고딕</option>
                <option value="'Gowun Batang', serif">진지한 고급 고운명조체</option>
                <option value="'Black Han Sans', sans-serif">강렬한 미디어 속보체</option>
                <option value="'Noto Serif KR', serif">전통 신문 정통 뉴스체</option>
            </select>
        </div>

        <!-- 4. 레이아웃 제어 정렬 모듈 -->
        <div class="control-item">
            <label>콘텐츠 정렬 위치</label>
            <div class="option-buttons" id="alignBtnGroup">
                <button data-align="left" class="active">왼쪽</button>
                <button data-align="center">가운데</button>
                <button data-align="right">오른쪽</button>
            </div>
        </div>

        <!-- 5. 보더 라운딩 외곽 제어 포지션 -->
        <div class="control-item">
            <label>카드 외곽 모서리 곡률</label>
            <div class="option-buttons" id="radiusBtnGroup">
                <button data-radius="0px" class="active">직각 사각</button>
                <button data-radius="24px">둥근 사각</button>
                <button data-radius="48px">매우 둥글게</button>
            </div>
        </div>
    </div>


    <!-- [우측 실시간 스튜디오 렌더링 스페이스] -->
    <div class="workspace">

<script>
📸 고화질 인스타용 이미지 파일 즉시 다운로드

const targetCard = document.getElementById('targetCard');
const displayTitle = document.getElementById('displayTitle');
const displayContent = document.getElementById('displayContent');
const badgeContainer = document.getElementById('badgeContainer');
const cardOverlay = document.getElementById('cardOverlay');
// 실시간 입력 버퍼 동기화 모듈
document.getElementById('keywordInput').addEventListener('input', function(e) {
if(displayTitle) displayTitle.innerText = e.target.value;
});
document.getElementById('contentInput').addEventListener('input', function(e) {
if(displayContent) displayContent.innerText = e.target.value;
});
// 캡슐화 데이터 주입식 배경 인라인 파일 리더 트랙 구현 (파일명 특수문자 버그 박멸 완료)
document.getElementById('imageUpload').addEventListener('change', function(e) {
const files = e.target.files;
if (files && files[0]) {
const reader = new FileReader();
reader.onload = function(event) {
// 데이터 URL 주소 구조 내에서 안전하게 주입되도록 쌍따옴표 래핑 조립 기술 반영
targetCard.style.backgroundImage = 'url("' + event.target.result + '")';
// 슬라이더 지표 밸런스에 기반하여 가림막 알파 연동 최적화 가동
const currentSliderValue = document.getElementById('opacitySlider').value;
const calculatedAlpha = 1 - currentSliderValue;
cardOverlay.style.backgroundColor = "rgba(255, 255, 255, " + calculatedAlpha + ")";
};
reader.readAsDataURL(files[0]);
}
});
// 슬라이더 바 인텐시티(진하기) 계산 로직 리밸런싱
document.getElementById('opacitySlider').addEventListener('input', function(e) {
if(cardOverlay) {
// 오른쪽으로 갈수록 사진이 나타나려면 하얀막 투명도는 역으로 낮아져야 합니다.
const calculatedAlpha = 1 - e.target.value;
cardOverlay.style.backgroundColor = "rgba(255, 255, 255, " + calculatedAlpha + ")";
}
});
// 폰트 종류 실시간 전환 엔진
document.getElementById('fontPicker').addEventListener('change', function(e) {
if(targetCard) targetCard.style.fontFamily = e.target.value;
});
// 수평 정렬 트랙 제어 루프
const alignButtons = document.querySelectorAll('#alignBtnGroup button');
alignButtons.forEach(function(button) {
button.addEventListener('click', function() {
const alignValue = this.getAttribute('data-align');
if(targetCard) targetCard.style.textAlign = alignValue;
if (badgeContainer) {
if (alignValue === 'left') badgeContainer.style.justifyContent = 'flex-start';
if (alignValue === 'center') badgeContainer.style.justifyContent = 'center';
if (alignValue === 'right') badgeContainer.style.justifyContent = 'flex-end';
}
alignButtons.forEach(function(btn) { btn.classList.remove('active'); });
this.classList.add('active');
});
});
// 외곽 곡률 라운딩 제어 루프
const radiusButtons = document.querySelectorAll('#radiusBtnGroup button');
radiusButtons.forEach(function(button) {
button.addEventListener('click', function() {
const radiusValue = this.getAttribute('data-radius');
if(targetCard) targetCard.style.borderRadius = radiusValue;
radiusButtons.forEach(function(btn) { btn.classList.remove('active'); });
this.classList.add('active');
});
});
// 초고화질 스크린 디바이스 보정 스냅샷 모듈 연결
document.getElementById('downloadBtn').addEventListener('click', function() {
if(!targetCard) return;
html2canvas(targetCard, {
useCORS: true,
scale: 2,            // 선명한 이미지 생성을 위해 해상도 배율 2배 설정
logging: false
}).then(function(canvas) {
const link = document.createElement('a');
link.download = 'instagram-news-cover.png';
link.href = canvas.toDataURL('image/png');
link.click();
}).catch(function(err) {
console.error(err);
alert('이미지 파일 다운로드 도중 에러가 발생했습니다.');
});
});

    
</script>
