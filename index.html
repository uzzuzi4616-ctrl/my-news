<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>돈벌쥐 - AI 뉴스 카드 생성기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
  <style>
    :root { --blue:#2563eb; --ink:#111827; --muted:#6b7280; --line:#e5e7eb; }
    * { box-sizing:border-box; }
    body {
      margin:0; padding:32px 16px 48px; min-height:100vh;
      font-family:Pretendard,system-ui,-apple-system,sans-serif;
      background:#f3f4f6; color:#1f2937;
    }
    button,input,select,textarea { font:inherit; }
    button { cursor:pointer; }
    .main-container {
      width:min(100%,760px); margin:0 auto; padding:30px;
      background:#fff; border-radius:24px; box-shadow:0 10px 30px rgba(0,0,0,.06);
    }
    .logo-area { text-align:center; margin-bottom:32px; }
    .logo-title { margin:0; display:flex; align-items:center; justify-content:center; gap:8px; color:#111827; font-size:30px; font-weight:900; }
    .logo-sub { margin:7px 0 0; color:#6b7280; font-size:13px; font-weight:600; }
    .step-section { margin-bottom:32px; }
    .step-title { display:flex; align-items:center; gap:10px; margin:0 0 15px; font-size:18px; font-weight:800; color:#111827; }
    .step-number { width:25px; height:25px; display:inline-flex; align-items:center; justify-content:center; border-radius:50%; background:var(--blue); color:#fff; font-size:13px; }
    .top-btn-group,.card-shape-group,.option-buttons { display:flex; gap:10px; }
    .action-btn,.shape-box,.option-buttons button {
      border:1px solid var(--line); border-radius:12px; transition:.15s ease;
    }
    .action-btn { flex:1; min-height:48px; padding:12px; display:flex; align-items:center; justify-content:center; gap:8px; font-size:14px; font-weight:700; }
    .btn-blue { color:var(--blue); background:#eff6ff; border-color:#bfdbfe; }
    .btn-gray { color:#4b5563; background:#f3f4f6; }
    .action-btn:hover,.option-buttons button:hover { filter:brightness(.98); transform:translateY(-1px); }
    .shape-box { flex:1; min-width:0; padding:17px 8px; display:flex; flex-direction:column; align-items:center; gap:8px; background:#fff; }
    .shape-box.active { border:2px solid var(--blue); padding:16px 7px; background:#eff6ff; }
    .shape-icon { display:block; border:2px solid #9ca3af; background:#fff; border-radius:3px; }
    .shape-box.active .shape-icon { border-color:var(--blue); }
    .icon-horizontal { width:34px; height:22px; }
    .icon-square { width:27px; height:27px; }
    .icon-vertical { width:20px; height:34px; }
    .shape-name { font-size:14px; font-weight:800; color:#111827; }
    .shape-desc { font-size:11px; color:#6b7280; }
    .input-item { margin-bottom:18px; }
    .input-item:last-child { margin-bottom:0; }
    .input-item label,.field-label { display:block; margin-bottom:8px; font-size:13px; font-weight:800; color:#4b5563; }
    .input-item input[type="text"],.input-item input[type="date"],.input-item input[type="file"],
    .input-item select,.input-item textarea {
      width:100%; padding:12px 13px; border:1px solid #d1d5db; border-radius:10px;
      background:#f9fafb; color:#111827; outline:none; font-size:14px;
    }
    .input-item textarea { min-height:105px; resize:vertical; line-height:1.55; }
    .input-item input:focus,.input-item select:focus,.input-item textarea:focus { border-color:var(--blue); background:#fff; box-shadow:0 0 0 3px rgba(37,99,235,.09); }
    .input-item input[type="range"] { width:100%; accent-color:var(--blue); }
    .range-row { display:flex; justify-content:space-between; align-items:center; gap:12px; font-size:12px; color:#6b7280; }
    .range-row strong { color:var(--blue); }
    .option-buttons button { flex:1; padding:10px 8px; background:#f3f4f6; color:#4b5563; font-size:13px; font-weight:700; }
    .option-buttons button.active { color:#fff; background:var(--blue); border-color:var(--blue); }
    .two-col { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .hint { margin:7px 0 0; font-size:12px; color:#6b7280; line-height:1.5; }
    .preview-area-wrapper { display:flex; flex-direction:column; align-items:center; width:100%; }
    .preview-title { width:100%; max-width:600px; margin:0 0 12px; font-size:15px; font-weight:800; color:#4b5563; }
    .preview-frame { width:100%; display:flex; justify-content:center; overflow:hidden; padding:2px 0 8px; }
    .insta-card {
      --card-width:540px; --card-height:540px;
      width:var(--card-width); height:var(--card-height); flex:none;
      background:#fff; background-size:cover; background-position:center; background-repeat:no-repeat;
      padding:45px; display:flex; flex-direction:column; position:relative; overflow:hidden;
      box-shadow:0 15px 35px rgba(0,0,0,.06); text-align:left; border-radius:12px;
      transform-origin:top center;
    }
    .card-overlay { position:absolute; inset:0; background:rgba(255,255,255,.88); z-index:1; pointer-events:none; }
    .card-content-area { position:relative; z-index:2; display:flex; flex-direction:column; height:100%; width:100%; min-width:0; }
    .badge-container { display:flex; justify-content:flex-start; margin-bottom:16px; }
    .naver-badge { display:inline-block; background:#00c73c; color:white; font-size:13px; font-weight:800; padding:6px 12px; border-radius:4px; }
    .divider-line { flex:none; height:4px; background:#111; margin-bottom:24px; width:100%; }
    .news-title { font-size:38px; font-weight:800; color:#000; margin:0 0 12px; line-height:1.32; word-break:keep-all; overflow-wrap:anywhere; }
    .news-date { font-size:13px; color:#6b7280; margin-bottom:20px; }
    .news-content { font-size:20px; color:#374151; line-height:1.62; margin:0; white-space:pre-wrap; overflow-wrap:anywhere; }
    .card-footer { position:absolute; bottom:28px; left:45px; right:45px; font-size:12px; color:#9ca3af; text-align:center; z-index:2; font-weight:700; }
    .submit-download-btn { width:100%; max-width:540px; background:#111827; color:#fff; border:0; padding:16px; font-size:16px; font-weight:800; border-radius:12px; margin-top:18px; box-shadow:0 4px 12px rgba(0,0,0,.1); }
    .submit-download-btn:hover { background:#1f2937; }
    .status { min-height:20px; margin-top:10px; text-align:center; color:#2563eb; font-size:13px; font-weight:600; }
    .small-btn { padding:8px 11px; border:1px solid #d1d5db; border-radius:8px; background:#fff; color:#4b5563; font-size:12px; font-weight:700; }
    @media (max-width:600px) {
      body { padding:14px 10px 28px; }
      .main-container { padding:20px 15px; border-radius:18px; }
      .logo-title { font-size:26px; }
      .top-btn-group,.card-shape-group { gap:7px; }
      .shape-box { padding:14px 4px; }
      .shape-box.active { padding:13px 3px; }
      .shape-desc { font-size:10px; }
      .two-col { grid-template-columns:1fr; gap:0; }
      .insta-card { border-radius:8px; }
    }
  </style>
</head>
<body>
  <main class="main-container">
    <header class="logo-area">
      <h1 class="logo-title">돈벌쥐 <span aria-hidden="true">🐭</span></h1>
      <p class="logo-sub">AI 뉴스 카드 생성기 · 쉽고 빠르게 카드뉴스 만들기</p>
    </header>

    <section class="step-section">
      <h2 class="step-title"><span class="step-number">1</span> 카드에 사용할 배경</h2>
      <div class="top-btn-group">
        <button class="action-btn btn-blue" id="uploadTrigger" type="button">🖼️ 배경 이미지 업로드</button>
        <button class="action-btn btn-gray" id="resetBackground" type="button">↺ 기본 배경으로</button>
      </div>
      <input id="backgroundUpload" type="file" accept="image/*" hidden>
      <p class="hint">직접 촬영한 사진이나 사용 권한이 있는 이미지를 업로드할 수 있어요.</p>
    </section>

    <section class="step-section">
      <h2 class="step-title"><span class="step-number">2</span> 카드 비율 선택</h2>
      <div class="card-shape-group" role="group" aria-label="카드 비율 선택">
        <button class="shape-box" data-shape="horizontal" type="button" aria-pressed="false">
          <span class="shape-icon icon-horizontal"></span><span class="shape-name">가로형</span><span class="shape-desc">유튜브 · 블로그</span>
        </button>
        <button class="shape-box active" data-shape="square" type="button" aria-pressed="true">
          <span class="shape-icon icon-square"></span><span class="shape-name">정사각형</span><span class="shape-desc">인스타그램</span>
        </button>
        <button class="shape-box" data-shape="vertical" type="button" aria-pressed="false">
          <span class="shape-icon icon-vertical"></span><span class="shape-name">세로형</span><span class="shape-desc">쇼츠 · 릴스</span>
        </button>
      </div>
    </section>

    <section class="step-section">
      <h2 class="step-title"><span class="step-number">3</span> 뉴스 내용과 디자인</h2>
      <div class="input-item">
        <label for="badgeText">상단 카테고리 문구</label>
        <input id="badgeText" type="text" value="돈벌쥐 뉴스" maxlength="24">
      </div>
      <div class="input-item">
        <label for="newsTitleInput">뉴스 제목</label>
        <input id="newsTitleInput" type="text" value="오늘의 핵심 뉴스를 한눈에" maxlength="100">
      </div>
      <div class="two-col">
        <div class="input-item">
          <label for="newsDateInput">날짜</label>
          <input id="newsDateInput" type="text">
        </div>
        <div class="input-item">
          <label for="badgeColor">카테고리 배지 색상</label>
          <select id="badgeColor">
            <option value="#00c73c">네이버 그린</option>
            <option value="#2563eb">블루</option>
            <option value="#7c3aed">퍼플</option>
            <option value="#e11d48">로즈</option>
            <option value="#111827">블랙</option>
            <option value="#f59e0b">골드</option>
          </select>
        </div>
      </div>
      <div class="input-item">
        <label for="newsContentInput">본문 내용</label>
        <textarea id="newsContentInput" maxlength="700">복잡한 소식도 핵심만 간결하게 정리해 보세요.
중요한 정보와 숫자를 쉽게 전달할 수 있습니다.</textarea>
      </div>
      <div class="input-item">
        <label for="footerInput">하단 출처 / 브랜드 문구</label>
        <input id="footerInput" type="text" value="돈벌쥐 · 오늘의 핵심 정보" maxlength="80">
      </div>
      <div class="two-col">
        <div class="input-item">
          <label for="titleSize">제목 크기</label>
          <input id="titleSize" type="range" min="22" max="54" value="38">
          <div class="range-row"><span>작게</span><strong id="titleSizeValue">38px</strong><span>크게</span></div>
        </div>
        <div class="input-item">
          <label for="contentSize">본문 크기</label>
          <input id="contentSize" type="range" min="14" max="30" value="20">
          <div class="range-row"><span>작게</span><strong id="contentSizeValue">20px</strong><span>크게</span></div>
        </div>
      </div>
      <div class="input-item">
        <label for="overlayOpacity">배경 밝기 / 글자 가독성</label>
        <input id="overlayOpacity" type="range" min="0" max="100" value="88">
        <div class="range-row"><span>사진 선명하게</span><strong id="overlayValue">88%</strong><span>밝게 덮기</span></div>
      </div>
      <div class="input-item">
        <label>본문 정렬</label>
        <div class="option-buttons" role="group" aria-label="본문 정렬">
          <button type="button" data-align="left" class="active">왼쪽</button>
          <button type="button" data-align="center">가운데</button>
          <button type="button" data-align="right">오른쪽</button>
        </div>
      </div>
    </section>

    <section class="preview-area-wrapper">
      <h2 class="preview-title">실시간 미리보기</h2>
      <div class="preview-frame" id="previewFrame">
        <article class="insta-card" id="card">
          <div class="card-overlay" id="cardOverlay"></div>
          <div class="card-content-area" id="cardContentArea">
            <div class="badge-container"><span class="naver-badge" id="previewBadge">돈벌쥐 뉴스</span></div>
            <div class="divider-line"></div>
            <h2 class="news-title" id="previewTitle">오늘의 핵심 뉴스를 한눈에</h2>
            <div class="news-date" id="previewDate"></div>
            <p class="news-content" id="previewContent">복잡한 소식도 핵심만 간결하게 정리해 보세요.
중요한 정보와 숫자를 쉽게 전달할 수 있습니다.</p>
          </div>
          <div class="card-footer" id="previewFooter">돈벌쥐 · 오늘의 핵심 정보</div>
        </article>
      </div>
      <button class="submit-download-btn" id="downloadButton" type="button">⬇ 고화질 PNG 이미지 저장</button>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      const card = $('card');
      const previewFrame = $('previewFrame');
      const defaultBackground = 'linear-gradient(135deg, #f8fafc 0%, #e0e7ff 50%, #fce7f3 100%)';
      let uploadedImageUrl = '';

      const today = new Date();
      $('newsDateInput').value = `${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')}`;
      card.style.backgroundImage = defaultBackground;

      function updatePreview() {
        $('previewBadge').textContent = $('badgeText').value.trim() || '돈벌쥐 뉴스';
        $('previewBadge').style.backgroundColor = $('badgeColor').value;
        $('previewTitle').textContent = $('newsTitleInput').value.trim() || '뉴스 제목을 입력해 주세요';
        $('previewDate').textContent = $('newsDateInput').value.trim();
        $('previewContent').textContent = $('newsContentInput').value;
        $('previewFooter').textContent = $('footerInput').value;
        $('previewTitle').style.fontSize = `${$('titleSize').value}px`;
        $('previewContent').style.fontSize = `${$('contentSize').value}px`;
        $('titleSizeValue').textContent = `${$('titleSize').value}px`;
        $('contentSizeValue').textContent = `${$('contentSize').value}px`;
        const opacity = Number($('overlayOpacity').value) / 100;
        $('cardOverlay').style.backgroundColor = `rgba(255,255,255,${opacity})`;
        $('overlayValue').textContent = `${$('overlayOpacity').value}%`;
        updateScale();
      }

      function setShape(shape) {
        document.querySelectorAll('.shape-box').forEach(btn => {
          const active = btn.dataset.shape === shape;
          btn.classList.toggle('active', active);
          btn.setAttribute('aria-pressed', String(active));
        });
        const sizes = {
          horizontal: [800, 450, 52],
          square: [540, 540, 45],
          vertical: [450, 800, 38]
        };
        const [w,h,p] = sizes[shape] || sizes.square;
        card.style.setProperty('--card-width', `${w}px`);
        card.style.setProperty('--card-height', `${h}px`);
        card.style.width = `${w}px`;
        card.style.height = `${h}px`;
        card.style.padding = `${p}px`;
        $('previewFooter').style.left = `${p}px`;
        $('previewFooter').style.right = `${p}px`;
        $('previewFooter').style.bottom = `${Math.max(24, p-12)}px`;
        $('previewTitle').style.fontSize = `${Math.min(Number($('titleSize').value), shape === 'vertical' ? 34 : 54)}px`;
        $('previewContent').style.fontSize = `${Math.min(Number($('contentSize').value), shape === 'vertical' ? 19 : 30)}px`;
        updateScale();
      }

      function updateScale() {
        const available = Math.max(240, previewFrame.clientWidth - 4);
        const cardWidth = card.offsetWidth || 540;
        const scale = Math.min(1, available / cardWidth);
        card.style.transform = `scale(${scale})`;
        previewFrame.style.height = `${card.offsetHeight * scale + 8}px`;
      }

      $('uploadTrigger').addEventListener('click', () => $('backgroundUpload').click());
      $('backgroundUpload').addEventListener('change', (event) => {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          $('status').textContent = '이미지 파일을 선택해 주세요.';
          return;
        }
        if (uploadedImageUrl) URL.revokeObjectURL(uploadedImageUrl);
        uploadedImageUrl = URL.createObjectURL(file);
        card.style.backgroundImage = `url("${uploadedImageUrl}")`;
        $('status').textContent = '배경 이미지를 적용했어요.';
      });
      $('resetBackground').addEventListener('click', () => {
        if (uploadedImageUrl) URL.revokeObjectURL(uploadedImageUrl);
        uploadedImageUrl = '';
        $('backgroundUpload').value = '';
        card.style.backgroundImage = defaultBackground;
        $('status').textContent = '기본 배경으로 돌아왔어요.';
      });

      document.querySelectorAll('.shape-box').forEach(btn => btn.addEventListener('click', () => setShape(btn.dataset.shape)));
      document.querySelectorAll('[data-align]').forEach(btn => btn.addEventListener('click', () => {
        document.querySelectorAll('[data-align]').forEach(b => b.classList.toggle('active', b === btn));
        $('cardContentArea').style.textAlign = btn.dataset.align;
        $('cardContentArea').querySelector('.badge-container').style.justifyContent =
          btn.dataset.align === 'center' ? 'center' : btn.dataset.align === 'right' ? 'flex-end' : 'flex-start';
        $('previewDate').style.textAlign = btn.dataset.align;
        $('previewContent').style.textAlign = btn.dataset.align;
      }));

      ['badgeText','newsTitleInput','newsDateInput','newsContentInput','footerInput','badgeColor','titleSize','contentSize','overlayOpacity']
        .forEach(id => $(id).addEventListener('input', updatePreview));

      $('downloadButton').addEventListener('click', async () => {
        const status = $('status');
        const button = $('downloadButton');
        if (typeof html2canvas !== 'function') {
          status.textContent = '이미지 저장 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인한 뒤 새로고침해 주세요.';
          return;
        }
        const oldText = button.textContent;
        button.disabled = true;
        button.textContent = '이미지 생성 중...';
        status.textContent = '고화질 이미지를 만들고 있어요.';
        const oldTransform = card.style.transform;
        try {
          card.style.transform = 'none';
          const canvas = await html2canvas(card, {
            scale: 2, useCORS: true, backgroundColor: null,
            width: card.offsetWidth, height: card.offsetHeight,
            logging: false
          });
          const link = document.createElement('a');
          const safeTitle = ($('newsTitleInput').value.trim() || '돈벌쥐_뉴스카드')
            .replace(/[\\/:*?"<>|]/g, '').replace(/\s+/g, '_').slice(0,40);
          link.download = `${safeTitle || '돈벌쥐_뉴스카드'}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
          status.textContent = '완료! PNG 이미지가 다운로드되었어요.';
        } catch (error) {
          console.error(error);
          status.textContent = '저장에 실패했어요. 배경 이미지를 다시 선택하거나 브라우저를 새로고침해 주세요.';
        } finally {
          card.style.transform = oldTransform;
          button.disabled = false;
          button.textContent = oldText;
          updateScale();
        }
      });

      window.addEventListener('resize', updateScale);
      setShape('square');
      updatePreview();
    })();
  </script>
</body>
</html>
