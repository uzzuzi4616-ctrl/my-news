<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인스타용 인공지능 뉴스 표지 생성기</title>
    
    <!-- 1. 구글 웹폰트 정식 풀 주소 로드 -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <!-- 2. 화면 이미지 다운로드 라이브러리 정식 풀 주소 로드 -->
    <script src="https://cloudflare.com"></script>
    
    <style>
        body {
            font-family: 'Nanum Gothic', sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 40px;
        }

        /* [왼쪽] 디자인 편집 툴 스타일 */
        .editor-sidebar {
            width: 320px;
            background: #ffffff;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
            border: 1px solid #e9ecef;
            box-sizing: border-box;
        }
        .editor-sidebar h3 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 18px;
            color: #212529;
        }
        .editor-sidebar p {
            font-size: 13px;
            color: #868e96;
            margin-bottom: 24px;
        }
        .control-item {
            margin-bottom: 20px;
        }
        .control-item label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #495057;
            margin-bottom: 8px;
        }
        .control-item select,
        .control-item input[type="text"],
        .control-item input[type="file"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }
        .control-item input[type="file"] {
            padding: 6px 12px;
            cursor: pointer;
        }
        .control-item input[type="range"] {
            width: 100%;
            margin-top: 5px;
        }
        .control-item select:focus,
        .control-item input[type="text"]:focus {
            border-color: #00c73c;
        }
        .option-buttons {
            display: flex;
            gap: 6px;
            margin-top: 5px;
        }
        .option-buttons button {
            flex: 1;
            padding: 10px;
            background: #f1f3f5;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            color: #495057;
            cursor: pointer;
            transition: all 0.2s;
        }
        .option-buttons button:hover {
            background: #e9ecef;
        }
        .option-buttons button.active {
            background: #00c73c;
            color: #ffffff;
            border-color: #00c73c;
            font-weight: bold;
        }

        /* [오른쪽] 카드뉴스 작업 영역 */
        .workspace {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .workspace-title {
            align-self: flex-start;
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 12px;
        }
        .workspace-subtitle {
            align-self: flex-start;
            font-size: 13px;
            color: #666;
            margin-top: -8px;
            margin-bottom: 16px;
        }

        /* 실제 인스타 카드 (정사각형 메인 박스) */
        .insta-card {
            width: 540px;
            height: 540px;
            background-color: #ffffff;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            padding: 45px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            text-align: left;
            border-radius: 0px; 
            transition: border-radius 0.2s;
        }

        /* 오버레이 가림막 레이어 - 이제 하얀색이 아닌 어두운 조절용 투명 레이어로 개편 */
        .card-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.7); /* 기본적으로 하얀 방어막을 얇게 기본 세팅 */
            z-index: 1;
            transition: background-color 0.1s ease;
            pointer-events: none;
        }

        /* 내부 콘텐츠 영역 - 레이어 위로 올리기 */
        .card-content-area {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }
        .badge-container {
            display: flex;
            justify-content: flex-start; 
            margin-bottom: 16px;
        }
        .naver-badge {
            background-color: #00c73c;
            color: white;
            font-size: 13px;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 2px;
        }
        .divider-line {
            height: 4px;
            background-color: #000000;
            margin-bottom: 24px;
            width: 100%;
        }
        .news-title {
            font-size: 38px;
            font-weight: 700;
            color: #000000;
            margin: 0 0 12px 0;
            line-height: 1.3;
            word-break: keep-all;
        }
        .news-date {
            font-size: 14px;
            color: #757575;
            margin-bottom: 24px;
        }
        .news-content {
            font-size: 20px;
            color: #333333;
            line-height: 1.6;
            margin: 0;
            white-space: pre-wrap;
        }

        /* 하단 워터마크 안내 문구 */
        .card-footer {
            position: absolute;
            bottom: 35px;
            left: 45px;
            right: 45px;
            font-size: 12px;
            color: #b0b0b0;
            text-align: center;
            z-index: 2;
        }

        /* 인스타 이미지 파일 다운로드 버튼 */
        .download-action-btn {
            width: 540px;
            background-color: #111111;
            color: #ffffff;
            border: none;
            padding: 16px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            margin-top: 20px;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s;
        }
        .download-action-btn:hover {
            background-color: #222222;
        }
    </style>
</head>
<body>

    <!-- [왼쪽] 디자인 편집 도구 영역 -->
    <div class="editor-sidebar">
        <h3>디자인 편집 툴</h3>
        <p>글자 스타일과 테두리 모양을 실시간으로 편집해 보세요.</p>
        
        <!-- 이미지 업로드 및 진하기 조절 기능 -->
        <div class="control-item">
            <label for="imageUpload">배경 이미지 업로드</label>
            <input type="file" id="imageUpload" accept="image/*">
        </div>
        
        <div class="control-item">
            <label for="opacitySlider">배경 이미지 선명도(오른쪽으로 갈수록 진해짐)</label>
            <!-- ★ 직관성을 위해 오른쪽으로 당길수록 배경 사진이 선명하게 나타나도록 전면 수정 완료 ★ -->
            <input type="range" id="opacitySlider" min="0" max="1" step="0.05" value="0.3">
        </div>

        <!-- 텍스트 입력 제어 -->
        <div class="control-item">
            <label for="keywordInput">기사 제목</label>
            <input type="text" id="keywordInput" value="테스트">
        </div>

        <div class="control-item">
            <label for="contentInput">기사 본문 내용</label>
            <input type="text" id="contentInput" value="테스트...">
        </div>

        <!-- 글씨 폰트 셀렉터 -->
        <div class="control-item">
            <label for="fontPicker">글씨 폰트 변경</label>
            <select id="fontPicker">
                <option value="'Nanum Gothic', sans-serif">기본 깔끔한 고딕체</option>
                <option value="'Gowun Batang', serif">단정한 고전 명조체</option>
                <option value="'Black Han Sans', sans-serif">속보용 두꺼운 헤드라인체</option>
                <option value="'Song Myung', serif">날카로운 뉴스 신문체</option>
            </select>
        </div>

        <!-- 정렬 컨트롤러 -->
        <div class="control-item">
            <label>글씨 및 콘텐츠 정렬</label>
            <div class="option-buttons" id="alignBtnGroup">
                <button data-align="left" class="active">왼쪽</button>
                <button data-align="center">가운데</button>
                <button data-align="right">오른쪽</button>
            </div>
        </div>

        <!-- 모서리 모양 외곽 컨트롤러 -->
        <div class="control-item">
            <label>이미지 외곽 모양 조절</label>
            <div class="option-buttons" id="radiusBtnGroup">
                <button data-radius="0px" class="active">직각 사각형</button>
                <button data-radius="24px">둥근 사각형</button>
                <button data-radius="48px">많이 둥글게</button>
            </div>
        </div>
    </div>


    <!-- [오른쪽] 정사각형 카드뉴스 작업 결과물 영역 -->
    <div class="workspace">
        <div class="workspace-title">테스트</div>
        <div class="workspace-subtitle">📁 자동 생성된 인스타 정사각형 뉴스 표지</div>

        <!-- 메인 카드 본체 -->
        <div class="insta-card" id="targetCard">
            <!-- 투명 가림막 레이어 -->
            <div class="card-overlay" id="cardOverlay"></div>

            <div class="card-content-area">
                <div class="badge-container" id="badgeContainer">
                    <span class="naver-badge">네이버 뉴스</span>
                </div>
                <div class="divider-line"></div>
                
                <h1 class="news-title" id="displayTitle">테스트</h1>
                <div class="news-date">기사입력 : 2026. 10. 14. | 속보전문팀</div>
                <p class="news-content" id="displayContent">테스트...</p>
            </div>

<script>

Powered by AI News Generator (무료 부수입 도구)

💾 인스타용 이미지 파일 다운로드

const targetCard = document.getElementById('targetCard');
const displayTitle = document.getElementById('displayTitle');
const displayContent = document.getElementById('displayContent');
const badgeContainer = document.getElementById('badgeContainer');
const cardOverlay = document.getElementById('cardOverlay');
// 실시간 글자 타이핑 연동
document.getElementById('keywordInput').addEventListener('input', function(e) {
if(displayTitle) displayTitle.innerText = e.target.value;
});
document.getElementById('contentInput').addEventListener('input', function(e) {
if(displayContent) displayContent.innerText = e.target.value;
});
// 로컬 배경 이미지 업로드 메커니즘
document.getElementById('imageUpload').addEventListener('change', function(e) {
const files = e.target.files;
if (files && files[0]) {
const reader = new FileReader();
reader.onload = function(event) {
targetCard.style.backgroundImage = url("${event.target.result}");
// 슬라이더 조절 방향 직관적으로 개선하여 반영
const currentVal = document.getElementById('opacitySlider').value;
const finalAlpha = 1 - currentVal;
cardOverlay.style.backgroundColor = rgba(255, 255, 255, ${finalAlpha});
};
reader.readAsDataURL(files[0]);
}
});
// 슬라이더를 오른쪽으로 밀수록 사진이 선명해지도록 수식 수정
document.getElementById('opacitySlider').addEventListener('input', function(e) {
if(cardOverlay) {
const finalAlpha = 1 - e.target.value;
cardOverlay.style.backgroundColor = rgba(255, 255, 255, ${finalAlpha});
}
});
// 드롭다운 대화창 웹 폰트 변경 연동
document.getElementById('fontPicker').addEventListener('change', function(e) {
if(targetCard) targetCard.style.fontFamily = e.target.value;
});
// 가로 정렬 버튼 시스템 이벤트 세팅
const alignButtons = document.querySelectorAll('#alignBtnGroup button');
alignButtons.forEach(function(button) {
button.addEventListener('click', function() {
const alignValue = this.getAttribute('data-align');
if(targetCard) targetCard.style.textAlign = alignValue;
if (badgeContainer) {
if (alignValue === 'left') badgeContainer.style.justifyContent = 'flex-start';
if (alignValue === 'center') badgeContainer.style.justifyContent = 'center';
if (alignValue === 'right') badgeContainer.style.justifyContent = 'flex-end';
}
alignButtons.forEach(function(btn) { btn.classList.remove('active'); });
this.classList.add('active');
});
});
// 테두리 깎기(모서리 모양) 버튼 시스템 이벤트 세팅
const radiusButtons = document.querySelectorAll('#radiusBtnGroup button');
radiusButtons.forEach(function(button) {
button.addEventListener('click', function() {
const radiusValue = this.getAttribute('data-radius');
if(targetCard) targetCard.style.borderRadius = radiusValue;
radiusButtons.forEach(function(btn) { btn.classList.remove('active'); });
this.classList.add('active');
});
});
// 최종 고화질 이미지 다운로드 처리 모듈
document.getElementById('downloadBtn').addEventListener('click', function() {
if(!targetCard) return;
html2canvas(targetCard, {
useCORS: true,
scale: 2,
logging: false
}).then(function(canvas) {
const link = document.createElement('a');
link.download = 'instagram-news-cover.png';
link.href = canvas.toDataURL('image/png');
link.click();
}).catch(function(err) {
console.error(err);
alert('이미지 파일 다운로드 도중 에러가 발생했습니다.');
});
});
    
</script>
